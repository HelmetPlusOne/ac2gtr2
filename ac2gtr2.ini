[track]
# Scale factor per texture dimension in (0, 1].
# 0.5 halves width and height; 1.0 keeps full resolution.
texture_scale=0.5

# Minimum texture size (max(width, height), inclusive) to apply texture_scale.
# 1024 scales 1024x1024 and larger; 512x512 and smaller are not scaled down.
# Also acts as a destination floor for scaled textures: max(width, height) is
# not reduced below the largest power-of-two size smaller than this threshold
# (e.g. with 1024 and texture_scale=0.25, 1024x1024 becomes 512x512, not 256x256).
# Set to 0 to scale all textures regardless of size.
texture_scale_min_size=1024

# Physical road surface smoothing strength in [0.0, 1.0] (default 0.5).
# Uses a C2 triweight quadratic MLS filter in Y to remove laser-scan micro-bumps
# for GTR2's single-point HAT raycaster while preserving hills, crests, and camber.
# Mapped uniformly to effective smoothing radius sigma in [0.0m, 8.0m] (sigma = 8 * value):
#   0.0  -> sigma = 0.0m  (disabled, keep raw AC road mesh)
#   0.25 -> sigma = 2.0m  (light smoothing)
#   0.5  -> sigma = 4.0m  (default, smooth road)
#   0.75 -> sigma = 6.0m  (very smooth / glass-like)
#   1.0  -> sigma = 8.0m  (maximum smoothness)
# Increase toward 1.0 for a smoother, flatter road; decrease toward 0.0 for less smoothing.
road_smoothness=0.5

# Deterministic Blender mesh coarsening strength in [0.0, 1.0] (default 0.0).
# Uses Blender's boundary-preserving QEM DECIMATE modifier before GMT splitting
# to shrink dense AC track meshes while keeping chunk seams, UVs, custom normals,
# and billboard cards intact:
#   0.0  -> disabled (coarsening is not run)
#   0.5  -> moderate reduction (~25% road/decals, ~30% visual ground, ~37.5% scenery)
#   1.0  -> strongest safe reduction (~50% road/decals, ~60% visual ground,
#           ~65% off-track/wall collision, ~75% scenery; major geometry intact)
mesh_coarsening=0.0

# Strip unused per-GMT data during GTR2 conversion (default true):
#   1. Omits collision FaceData and NormalData (48 B/triangle) on visual-only
#      (CollTarget=False) GMTs (physical road/kerb/wall/timing GMTs stay intact).
#   2. Downgrades flat-normal/flat-spec L2BUMPSPECMAPT0 cutouts (trees, grass,
#      fences) to GTR2's native ColorKey L2DIFFUSET0, dropping unused 24 B/vertex
#      UVTangents and dummy texture lookups.
# Rendered geometry and road physics are unchanged. Set to false to disable both.
strip_unused_gmt_data=true

# Track shadow casting mode for GTR2's per-instance projected shadow engine
# (default compact):
#   compact -> ShadowReceiver=True on road/ground only (cars cast shadows on
#              the road); ShadowCaster=(Static, Solid, 32/64) only on compact
#              opaque structures (radius <= 60m, <= 8000 tris), no foliage
#              Texture shadow maps, MaxShadowRange=(200.0). Matches stock GTR2
#              shadow budgets for high FPS with Shadows enabled.
#   off     -> No track ShadowCaster entries (cars still cast shadows onto
#              road/ground). Maximum FPS with GTR2 Shadows enabled.
#   full    -> Opaque and foliage Texture casters (radius <= 150m, 64x64 maps,
#              MaxShadowRange=(250.0)); heavier in GTR2 on dense tracks.
track_shadows=compact
